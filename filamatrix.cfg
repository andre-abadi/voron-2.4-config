# ============================================================
#  Filamatrix Dual-Switch Toolhead Sensors (Nitehawk USB MCU)
#  Upper switch = above drive gears
#  Lower switch = below drive gears (above melt zone)
#  FilamAtrix project:
#    https://github.com/thunderkeys/FilamAtrix
#  Nitehawk toolhead pinout:
#    https://github.com/MotorDynamicsLab/Nitehawk-SB
#    https://github.com/MotorDynamicsLab/Nitehawk-SB/blob/master/Images/nhsb_pcb_pinout.png
#    X = gpio13
#    Y = gpio12
# ============================================================

# ------------------------------------------------------------
#  UPPER SWITCH  (Extruder Entry Sensor)
#  - Wired to Nitehawk X endstop header
# ------------------------------------------------------------
[filament_switch_sensor toolhead_upper]
switch_pin: ^nhk:gpio13
pause_on_runout: False

# ------------------------------------------------------------
#  LOWER SWITCH  (Melt-Zone Sensor)
#  - Wired to Nitehawk Y endstop header
# ------------------------------------------------------------
[filament_switch_sensor toolhead_lower]
switch_pin: ^nhk:gpio12
pause_on_runout: False
